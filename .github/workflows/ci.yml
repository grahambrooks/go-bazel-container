name: ci

# Minimal merge gate, provisioned by grahambrooks/auto-managed (ensure_ci.sh).
# Dependency PRs cannot auto-merge without a green check, so every managed repo
# needs at least this. Edit freely — the control plane never overwrites it.

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # Legacy WORKSPACE repo. `--enable_workspace` alone is not enough on
      # Bazel 8+: Bzlmod still owns repo resolution, so WORKSPACE deps stay
      # invisible ("No repository visible as '@io_bazel_rules_docker'"). Pin the
      # last Bazel line that treats WORKSPACE as native. Migrate the repo to
      # MODULE.bazel and this stack stops applying to it.
      - name: Build
        env:
          USE_BAZEL_VERSION: "7.4.1"
        run: bazel build //...
      - name: Test
        env:
          USE_BAZEL_VERSION: "7.4.1"
        run: bazel test //... --test_output=errors
